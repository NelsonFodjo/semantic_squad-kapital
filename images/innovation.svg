<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050d" />
      <stop offset="100%" stop-color="#0b0717" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb347" />
      <stop offset="50%" stop-color="#ff7a90" />
      <stop offset="100%" stop-color="#b58cff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(181, 140, 255, 0.45)" />
      <stop offset="100%" stop-color="rgba(255, 122, 144, 0.05)" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Grid Pattern -->
  <g stroke="rgba(255, 255, 255, 0.02)" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)" />
  </g>

  <!-- Central Radial Glow -->
  <circle cx="400" cy="300" r="200" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.6" />

  <!-- Abstract Geometry representing Innovation & Vision -->
  <g stroke-linecap="round" fill="none">
    <!-- Orbital Rings -->
    <ellipse cx="400" cy="300" rx="280" ry="120" stroke="rgba(181, 140, 255, 0.15)" stroke-width="2" transform="rotate(-15, 400, 300)" />
    <ellipse cx="400" cy="300" rx="240" ry="90" stroke="rgba(255, 122, 144, 0.15)" stroke-width="1.5" transform="rotate(15, 400, 300)" />
    <ellipse cx="400" cy="300" rx="310" ry="150" stroke="rgba(56, 217, 232, 0.1)" stroke-width="1" stroke-dasharray="10 10" />

    <!-- Wave paths / Sinusoid lines representing digital frequencies -->
    <path d="M 100 350 Q 250 150 400 300 T 700 250" stroke="url(#primaryGrad)" stroke-width="4.5" filter="url(#glow)" />
    <path d="M 100 380 Q 250 180 400 330 T 700 280" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
    
    <!-- Concentric Target Circles (The "Vision" lens) -->
    <g transform="translate(400, 300)">
      <circle cx="0" cy="0" r="80" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <circle cx="0" cy="0" r="50" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
      <circle cx="0" cy="0" r="20" stroke="#ff7a90" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#38d9e8" />
      
      <!-- Crosshairs -->
      <line x1="-100" y1="0" x2="-60" y2="0" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
      <line x1="60" y1="0" x2="100" y2="0" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
      <line x1="0" y1="-100" x2="0" y2="-60" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
      <line x1="0" y1="60" x2="0" y2="100" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    </g>

    <!-- Glowing Node Connectors -->
    <g stroke="rgba(255, 255, 255, 0.2)" stroke-width="1">
      <!-- Top Left Node group -->
      <line x1="280" y1="210" x2="220" y2="170" />
      <circle cx="280" cy="210" r="5" fill="#ffb347" />
      <circle cx="220" cy="170" r="8" fill="#05050d" stroke="#ff7a90" stroke-width="2" />
      
      <!-- Bottom Right Node group -->
      <line x1="520" y1="390" x2="580" y2="430" />
      <circle cx="520" cy="390" r="5" fill="#b58cff" />
      <circle cx="580" cy="430" r="8" fill="#05050d" stroke="#38d9e8" stroke-width="2" />

      <!-- Center Node overlays -->
      <circle cx="340" cy="250" r="4" fill="#ffffff" />
      <circle cx="470" cy="350" r="4" fill="#ffffff" />
    </g>
  </g>

  <!-- Overlaid Info HUD Graphic -->
  <g transform="translate(50, 450)">
    <rect width="220" height="90" rx="16" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.4)" letter-spacing="2">INNOVATION INDEX</text>
    <text x="20" y="65" font-family="system-ui, sans-serif" font-weight="700" font-size="28" fill="#ffffff">98.4</text>
    <path d="M 160 55 L 180 35 L 195 50 M 180 35 L 180 47" fill="none" stroke="#4ade9b" stroke-width="2" stroke-linecap="round" />
  </g>

  <g transform="translate(530, 60)">
    <rect width="220" height="90" rx="16" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.4)" letter-spacing="2">VISION ALIGNMENT</text>
    <text x="20" y="65" font-family="system-ui, sans-serif" font-weight="700" font-size="28" fill="url(#primaryGrad)">100%</text>
  </g>
</svg>
