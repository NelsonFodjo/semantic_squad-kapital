<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050d" />
      <stop offset="100%" stop-color="#06120e" />
    </linearGradient>
    <linearGradient id="palmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade9b" />
      <stop offset="50%" stop-color="#38d9e8" />
      <stop offset="100%" stop-color="#6aa8ff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(74, 222, 155, 0.4)" />
      <stop offset="100%" stop-color="rgba(56, 217, 232, 0.05)" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)" />
  </g>

  <!-- Radial Glow Behind -->
  <circle cx="400" cy="300" r="180" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.6" />

  <!-- Git network branch background details -->
  <g opacity="0.15" stroke-width="2" stroke-linecap="round">
    <path d="M 100 300 H 700" stroke="rgba(255, 255, 255, 0.3)" />
    <path d="M 250 300 Q 300 220 350 220 H 550 Q 600 300 650 300" stroke="#4ade9b" fill="none" />
    <path d="M 320 300 Q 370 380 420 380 H 500 Q 550 300 600 300" stroke="#38d9e8" fill="none" />
    <circle cx="250" cy="300" r="6" fill="#ffffff" />
    <circle cx="350" cy="220" r="6" fill="#4ade9b" />
    <circle cx="550" cy="220" r="6" fill="#4ade9b" />
    <circle cx="650" cy="300" r="6" fill="#ffffff" />
  </g>

  <!-- Glass Card (Open Source Mockup) -->
  <g transform="translate(150, 100)">
    <rect x="-1" y="-1" width="502" height="402" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <rect width="500" height="400" rx="24" fill="url(#cardGrad)" />

    <!-- Open Source Header -->
    <g transform="translate(30, 40)">
      <rect width="50" height="50" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <!-- Git branch icon representation -->
      <circle cx="20" cy="25" r="4" fill="none" stroke="url(#palmGrad)" stroke-width="2" />
      <circle cx="32" cy="18" r="4" fill="none" stroke="url(#palmGrad)" stroke-width="2" />
      <circle cx="32" cy="32" r="4" fill="none" stroke="url(#palmGrad)" stroke-width="2" />
      <path d="M 24 25 C 28 25 28 18 32 18 M 24 25 C 28 25 28 32 32 32" fill="none" stroke="url(#palmGrad)" stroke-width="2" />
      
      <text x="70" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#ffffff">creole-geocoder</text>
      <text x="70" y="42" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.5)">GitHub · lagoon-analytics</text>
    </g>

    <!-- Language Badge -->
    <g transform="translate(370, 40)">
      <rect width="100" height="36" rx="18" fill="rgba(106, 168, 255, 0.1)" stroke="rgba(106, 168, 255, 0.3)" stroke-width="1" />
      <text x="50" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#6aa8ff" text-anchor="middle">TypeScript</text>
    </g>

    <line x1="30" y1="120" x2="470" y2="120" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Open Pull Request / Activity -->
    <g transform="translate(30, 140)">
      <rect width="440" height="220" rx="16" fill="rgba(255, 255, 255, 0.01)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      
      <!-- Pull Request Title -->
      <g transform="translate(20, 25)">
        <rect width="90" height="24" rx="12" fill="rgba(74, 222, 155, 0.1)" stroke="rgba(74, 222, 155, 0.3)" stroke-width="1" />
        <circle cx="15" cy="12" r="4" fill="#4ade9b" />
        <text x="32" y="16" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#4ade9b">PR Open</text>
        <text x="100" y="16" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#ffffff">#14 Add Creole soundex rule</text>
      </g>

      <!-- Code Diff Preview -->
      <g transform="translate(20, 65)">
        <rect width="400" height="85" rx="8" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
        <g font-family="monospace" font-size="11" xml:space="preserve">
          <text x="15" y="25" fill="#ff8a8a">- const phoneticRules = ["a", "e", "i"];</text>
          <text x="15" y="45" fill="#7fe3ab">+ const phoneticRules = ["a", "e", "i", "ou", "en"];</text>
          <text x="15" y="65" fill="rgba(255, 255, 255, 0.4)">+ // Added local creole vocalisation matching</text>
        </g>
      </g>

      <!-- Contributor Avatars and Count -->
      <g transform="translate(20, 175)">
        <circle cx="15" cy="15" r="14" fill="rgba(181, 140, 255, 0.3)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="15" y="19" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">AP</text>

        <circle cx="35" cy="15" r="14" fill="rgba(56, 217, 232, 0.3)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="35" y="19" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">JL</text>

        <circle cx="55" cy="15" r="14" fill="rgba(255, 179, 71, 0.3)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="55" y="19" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">NS</text>

        <text x="80" y="20" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.5)">+12 student contributors this week</text>
      </g>
    </g>
  </g>
</svg>
