<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050d" />
      <stop offset="100%" stop-color="#0c0717" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb347" />
      <stop offset="50%" stop-color="#ff7a90" />
      <stop offset="100%" stop-color="#b58cff" />
    </linearGradient>
    <linearGradient id="coolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38d9e8" />
      <stop offset="50%" stop-color="#6aa8ff" />
      <stop offset="100%" stop-color="#b58cff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(106, 168, 255, 0.45)" />
      <stop offset="100%" stop-color="rgba(181, 140, 255, 0.05)" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="rgba(255, 255, 255, 0.02)" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)" />
  </g>

  <!-- Radial Glow Behind -->
  <circle cx="400" cy="300" r="180" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.6" />

  <!-- Connecting Nodes / Collaborative Network -->
  <g stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" fill="none">
    <!-- Starburst connections from center -->
    <line x1="400" y1="300" x2="250" y2="180" />
    <line x1="400" y1="300" x2="550" y2="180" />
    <line x1="400" y1="300" x2="250" y2="420" />
    <line x1="400" y1="300" x2="550" y2="420" />
    <line x1="400" y1="300" x2="150" y2="300" />
    <line x1="400" y1="300" x2="650" y2="300" />
    
    <!-- Large dotted circle -->
    <circle cx="400" cy="300" r="160" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" stroke-dasharray="8 8" />
  </g>

  <!-- Central Hub (Kapital Platform) -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="50" fill="rgba(106, 168, 255, 0.15)" stroke="url(#coolGrad)" stroke-width="3" filter="url(#glow)" />
    <!-- Globe/Platform graphic -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#38d9e8" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="25" ry="8" fill="none" stroke="#38d9e8" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="8" ry="25" fill="none" stroke="#38d9e8" stroke-width="1.5" />
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#38d9e8" stroke-width="1.5" />
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#38d9e8" stroke-width="1.5" />
  </g>

  <!-- Left node card (Student profile) -->
  <g transform="translate(150, 130)">
    <circle cx="0" cy="0" r="40" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" filter="url(#glow)" />
    <!-- Student graphic avatar -->
    <circle cx="0" cy="-5" r="10" fill="none" stroke="#38d9e8" stroke-width="2" />
    <path d="M -18 15 C -18 7 -10 5 0 5 C 10 5 18 7 18 15" fill="none" stroke="#38d9e8" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="30" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#ffffff" text-anchor="middle">Students</text>
  </g>

  <!-- Right node card (Verified Employers) -->
  <g transform="translate(570, 130)">
    <circle cx="0" cy="0" r="40" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" filter="url(#glow)" />
    <!-- Employer building avatar -->
    <rect x="-12" y="-12" width="24" height="24" rx="3" fill="none" stroke="#ff7a90" stroke-width="2" />
    <line x1="-6" y1="-6" x2="-6" y2="6" stroke="#ff7a90" stroke-width="2" />
    <line x1="6" y1="-6" x2="6" y2="6" stroke="#ff7a90" stroke-width="2" />
    <text x="0" y="30" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#ffffff" text-anchor="middle">Employers</text>
  </g>

  <!-- Bottom Left node card (Challenges) -->
  <g transform="translate(150, 370)">
    <circle cx="0" cy="0" r="40" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" filter="url(#glow)" />
    <!-- Code terminal avatar -->
    <path d="M -12 -6 L -4 0 L -12 6" fill="none" stroke="#4ade9b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="0" y1="6" x2="8" y2="6" stroke="#4ade9b" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="30" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#ffffff" text-anchor="middle">Challenges</text>
  </g>

  <!-- Bottom Right node card (Open Source) -->
  <g transform="translate(570, 370)">
    <circle cx="0" cy="0" r="40" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" filter="url(#glow)" />
    <!-- Branch avatar -->
    <path d="M 0 -12 V 12 M 0 0 C 8 0 12 4 12 12" fill="none" stroke="#b58cff" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="-12" r="3" fill="#b58cff" />
    <circle cx="12" cy="12" r="3" fill="#b58cff" />
    <circle cx="0" cy="12" r="3" fill="#b58cff" />
    <text x="0" y="30" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#ffffff" text-anchor="middle">Open Source</text>
  </g>

  <!-- Floating Stats Graphic inside network -->
  <g transform="translate(320, 480)">
    <rect width="160" height="40" rx="20" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="80" y="24" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">Active Connections: 400+</text>
  </g>
</svg>
