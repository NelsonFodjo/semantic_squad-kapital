<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="100%" height="100%">
  <!-- Flowing ascending lines representing growth & career paths -->
  <g stroke="#38d9e8" stroke-opacity="0.24" stroke-width="2" fill="none">
    <path d="M -100 800 C 300 800, 600 400, 1000 300 C 1400 200, 1500 50, 1800 50" />
    <path d="M -100 850 C 300 850, 620 440, 1020 340 C 1420 240, 1500 90, 1800 90" stroke-dasharray="12 12" />
    <path d="M -100 900 C 300 900, 640 480, 1040 380 C 1440 280, 1500 130, 1800 130" />
    
    <!-- Career Grid Matrix in background -->
    <path d="M 100 1000 L 400 700 M 400 700 L 800 500 M 800 500 L 1200 400" />
    <path d="M 200 1050 L 500 750 M 500 750 L 900 550 M 900 550 L 1300 450" stroke-dasharray="8 8" />
    
    <!-- Floating Opportunity Card Wireframes -->
    <g stroke-width="1.5">
      <rect x="350" y="650" width="140" height="90" rx="10" fill="rgba(56, 217, 232, 0.03)" />
      <circle cx="385" cy="685" r="12" />
      <line x1="410" y1="685" x2="465" y2="685" />
      <line x1="385" y1="715" x2="465" y2="715" />

      <rect x="750" y="450" width="160" height="100" rx="10" fill="rgba(56, 217, 232, 0.03)" stroke="#6aa8ff" stroke-opacity="0.2" />
      <circle cx="790" cy="490" r="14" stroke="#6aa8ff" stroke-opacity="0.2" />
      <line x1="815" y1="490" x2="880" y2="490" stroke="#6aa8ff" stroke-opacity="0.2" />
      <line x1="790" y1="522" x2="880" y2="522" stroke="#6aa8ff" stroke-opacity="0.2" />

      <rect x="1150" y="350" width="150" height="90" rx="10" stroke-dasharray="5 5" fill="rgba(56, 217, 232, 0.02)" />
      <circle cx="1185" cy="385" r="12" />
      <line x1="1210" y1="385" x2="1275" y2="385" />
    </g>
  </g>
</svg>
