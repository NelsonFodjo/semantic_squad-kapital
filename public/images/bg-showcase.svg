<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="100%" height="100%">
  <!-- Showcase portfolios / wireframes / accolade vectors -->
  <g stroke="#b58cff" stroke-opacity="0.24" stroke-width="2" fill="none">
    <!-- Starburst layout backgrounds -->
    <path d="M 800 600 C 600 300, 1000 300, 800 100" stroke-dasharray="6 6" />
    <path d="M 800 600 C 1000 900, 600 900, 800 1100" />
    
    <!-- User Profile Showcase Card Wireframes -->
    <g stroke-width="1.5">
      <rect x="200" y="300" width="320" height="210" rx="14" fill="rgba(181, 140, 255, 0.03)" />
      <circle cx="265" cy="370" r="32" />
      <line x1="315" y1="360" x2="475" y2="360" stroke-width="2.5" />
      <line x1="315" y1="390" x2="435" y2="390" />
      <rect x="230" y="445" width="80" height="26" rx="13" />
      <rect x="320" y="445" width="80" height="26" rx="13" />
      <rect x="410" y="445" width="80" height="26" rx="13" />
    </g>

    <!-- Project Box Wireframes -->
    <g stroke-width="1.5">
      <rect x="1080" y="600" width="340" height="250" rx="14" fill="rgba(255, 122, 144, 0.03)" stroke="#ff7a90" stroke-opacity="0.2" />
      <rect x="1110" y="630" width="280" height="120" rx="8" stroke-dasharray="5 5" stroke="#ff7a90" stroke-opacity="0.2" />
      <line x1="1110" y1="775" x2="1370" y2="775" stroke-width="2.5" stroke="#ff7a90" stroke-opacity="0.2" />
      <line x1="1110" y1="805" x2="1250" y2="805" stroke="#ff7a90" stroke-opacity="0.2" />
    </g>

    <!-- Accolades / Trophy Symbol Outline -->
    <g stroke-width="2">
      <path d="M 800 300 M 760 300 H 840 M 800 300 V 335 M 780 335 H 820 M 765 220 C 765 270, 835 270, 835 220 V 180 H 765 Z" />
      <path d="M 765 200 C 740 200 735 220 735 230 C 735 250 755 250 765 250" stroke-width="1.5" />
      <path d="M 835 200 C 860 200 865 220 865 230 C 865 250 845 250 835 250" stroke-width="1.5" />
    </g>
  </g>
</svg>
