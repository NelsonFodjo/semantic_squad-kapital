<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb347" />
      <stop offset="50%" stop-color="#ff7a90" />
      <stop offset="100%" stop-color="#b58cff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 122, 144, 0.35)" />
      <stop offset="100%" stop-color="rgba(181, 140, 255, 0.05)" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Transparent Backdrop for Glassmorphism -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Radial Glow Behind -->
  <circle cx="400" cy="300" r="180" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.6" />

  <!-- Glass Card (Challenges Mockup) -->
  <g transform="translate(150, 100)">
    <rect x="-1" y="-1" width="502" height="402" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    <rect width="500" height="400" rx="24" fill="url(#cardGrad)" />

    <!-- Challenge Header -->
    <g transform="translate(30, 40)">
      <rect width="50" height="50" rx="12" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <path d="M 15 25 L 25 15 L 35 25 L 25 35 Z" fill="none" stroke="url(#warmGrad)" stroke-width="2" />
      <path d="M 20 25 L 25 20 L 30 25" fill="none" stroke="#ff7a90" stroke-width="2" />
      
      <text x="70" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="var(--ink, #ffffff)">Predict Lagoon Water Quality</text>
      <text x="70" y="42" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.6)">Ocean Economy &amp; AI · EcoLagoon</text>
    </g>

    <!-- Cash Reward / Opportunity Bounty -->
    <g transform="translate(350, 40)">
      <rect width="120" height="36" rx="18" fill="rgba(255, 179, 71, 0.15)" stroke="rgba(255, 179, 71, 0.4)" stroke-width="1" />
      <text x="60" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffb347" text-anchor="middle">Rs 30,000 Prize</text>
    </g>

    <line x1="30" y1="120" x2="470" y2="120" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

    <!-- Code Editor Representation -->
    <g transform="translate(30, 140)">
      <rect width="440" height="220" rx="16" fill="rgba(5, 7, 15, 0.6)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      
      <!-- Editor Window Controls -->
      <circle cx="20" cy="20" r="5" fill="#ff8a8a" />
      <circle cx="36" cy="20" r="5" fill="#f5cd7b" />
      <circle cx="52" cy="20" r="5" fill="#7fe3ab" />
      <text x="420" y="24" font-family="monospace" font-size="11" fill="rgba(255, 255, 255, 0.4)" text-anchor="end">predict_bloom.py</text>

      <!-- Editor Code Lines -->
      <g font-family="monospace" font-size="12" xml:space="preserve">
        <text x="20" y="55" fill="rgba(255, 255, 255, 0.3)">1</text>
        <text x="40" y="55" fill="#ff7a90">def</text>
        <text x="75" y="55" fill="#38d9e8">predict_algal_bloom</text>
        <text x="225" y="55" fill="rgba(255, 255, 255, 0.9)">(sensor_df):</text>

        <text x="20" y="75" fill="rgba(255, 255, 255, 0.3)">2</text>
        <text x="60" y="75" fill="#ffb347">model</text>
        <text x="105" y="75" fill="rgba(255, 255, 255, 0.9)">= TimeSeriesTransformer()</text>

        <text x="20" y="95" fill="rgba(255, 255, 255, 0.3)">3</text>
        <text x="60" y="95" fill="rgba(255, 255, 255, 0.5)"># 48h horizon forecast on 12 buoys</text>

        <text x="20" y="115" fill="rgba(255, 255, 255, 0.3)">4</text>
        <text x="60" y="115" fill="#b58cff">return</text>
        <text x="115" y="115" fill="rgba(255, 255, 255, 0.9)">model.forecast_48h(sensor_df)</text>
      </g>
      
      <!-- Submission Status Badge -->
      <g transform="translate(280, 150)">
        <rect width="140" height="42" rx="21" fill="rgba(74, 222, 155, 0.2)" stroke="#4ade9b" stroke-width="1.5" />
        <circle cx="25" cy="21" r="5" fill="#4ade9b" />
        <text x="45" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#4ade9b">Accuracy: 98.4%</text>
      </g>
    </g>
  </g>
</svg>
