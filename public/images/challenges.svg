<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050d" />
      <stop offset="100%" stop-color="#140c0f" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb347" />
      <stop offset="50%" stop-color="#ff7a90" />
      <stop offset="100%" stop-color="#b58cff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 122, 144, 0.4)" />
      <stop offset="100%" stop-color="rgba(181, 140, 255, 0.05)" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)" />
  </g>

  <!-- Radial Glow Behind -->
  <circle cx="400" cy="300" r="180" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.6" />

  <!-- Abstract Vector Paths -->
  <g opacity="0.25">
    <path d="M 100 500 Q 250 200 450 400 T 700 100" fill="none" stroke="rgba(255, 122, 144, 0.2)" stroke-width="2" />
    <path d="M 100 480 Q 250 180 450 380 T 700 80" fill="none" stroke="rgba(255, 179, 71, 0.15)" stroke-width="1" />
    <circle cx="450" cy="400" r="6" fill="#ff7a90" />
    <circle cx="280" cy="310" r="4" fill="#ffb347" />
  </g>

  <!-- Glass Card (Challenges Mockup) -->
  <g transform="translate(150, 100)">
    <rect x="-1" y="-1" width="502" height="402" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <rect width="500" height="400" rx="24" fill="url(#cardGrad)" />

    <!-- Challenge Header -->
    <g transform="translate(30, 40)">
      <rect width="50" height="50" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <!-- Logic Puzzle Icon representation -->
      <path d="M 15 25 L 25 15 L 35 25 L 25 35 Z" fill="none" stroke="url(#warmGrad)" stroke-width="2" />
      <path d="M 20 25 L 25 20 L 30 25" fill="none" stroke="#ff7a90" stroke-width="2" />
      
      <text x="70" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#ffffff">Optimise Warehouse Routing</text>
      <text x="70" y="42" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.5)">Logistics & Operations · Rogers Group</text>
    </g>

    <!-- Cash Reward / Opportunity Bounty -->
    <g transform="translate(350, 40)">
      <rect width="120" height="36" rx="18" fill="rgba(255, 179, 71, 0.1)" stroke="rgba(255, 179, 71, 0.3)" stroke-width="1" />
      <text x="60" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffb347" text-anchor="middle">Prize & Interview</text>
    </g>

    <line x1="30" y1="120" x2="470" y2="120" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Code Editor Representation -->
    <g transform="translate(30, 140)">
      <rect width="440" height="220" rx="16" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      
      <!-- Editor Window Controls -->
      <circle cx="20" cy="20" r="5" fill="#ff8a8a" />
      <circle cx="36" cy="20" r="5" fill="#f5cd7b" />
      <circle cx="52" cy="20" r="5" fill="#7fe3ab" />
      <text x="420" y="24" font-family="monospace" font-size="11" fill="rgba(255, 255, 255, 0.2)" text-anchor="end">solution.rs</text>

      <!-- Editor Code Lines -->
      <g font-family="monospace" font-size="12" xml:space="preserve">
        <text x="20" y="55" fill="rgba(255, 255, 255, 0.3)">1</text>
        <text x="40" y="55" fill="#ff7a90">fn</text>
        <text x="60" y="55" fill="#38d9e8">optimise_route</text>
        <text x="165" y="55" fill="rgba(255, 255, 255, 0.8)">(nodes: &amp;[Node]) -&gt; Vec&lt;Node&gt; {</text>

        <text x="20" y="75" fill="rgba(255, 255, 255, 0.3)">2</text>
        <text x="60" y="75" fill="#ffb347">let</text>
        <text x="90" y="75" fill="rgba(255, 255, 255, 0.8)">mut matrix = DistanceMatrix::new();</text>

        <text x="20" y="95" fill="rgba(255, 255, 255, 0.3)">3</text>
        <text x="60" y="95" fill="rgba(255, 255, 255, 0.5)">// Apply nearest-neighbour search</text>

        <text x="20" y="115" fill="rgba(255, 255, 255, 0.3)">4</text>
        <text x="60" y="115" fill="#b58cff">for</text>
        <text x="90" y="115" fill="rgba(255, 255, 255, 0.8)">node in nodes {</text>

        <text x="20" y="135" fill="rgba(255, 255, 255, 0.3)">5</text>
        <text x="80" y="135" fill="rgba(255, 255, 255, 0.8)">matrix.calculate_heuristics(node);</text>

        <text x="20" y="155" fill="rgba(255, 255, 255, 0.3)">6</text>
        <text x="60" y="155" fill="rgba(255, 255, 255, 0.8)">}</text>

        <text x="20" y="175" fill="rgba(255, 255, 255, 0.3)">7</text>
        <text x="60" y="175" fill="rgba(255, 255, 255, 0.8)">matrix.shortest_path()</text>

        <text x="20" y="195" fill="rgba(255, 255, 255, 0.3)">8</text>
        <text x="40" y="195" fill="rgba(255, 255, 255, 0.8)">}</text>
      </g>
      
      <!-- Submission Glow Status -->
      <g transform="translate(300, 160)">
        <rect width="120" height="40" rx="20" fill="rgba(74, 222, 155, 0.15)" stroke="#4ade9b" stroke-width="1.5" />
        <circle cx="25" cy="20" r="5" fill="#4ade9b" />
        <text x="42" y="25" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#ffffff">Passes: 10/10</text>
      </g>
    </g>
  </g>
</svg>
