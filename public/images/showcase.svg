<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050d" />
      <stop offset="100%" stop-color="#0e0714" />
    </linearGradient>
    <linearGradient id="orchidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b58cff" />
      <stop offset="50%" stop-color="#ff7a90" />
      <stop offset="100%" stop-color="#38d9e8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(181, 140, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 122, 144, 0.05)" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)" />
  </g>

  <!-- Radial Glow Behind -->
  <circle cx="400" cy="300" r="180" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.6" />

  <!-- Decorative circles -->
  <g opacity="0.1">
    <circle cx="400" cy="300" r="280" fill="none" stroke="#b58cff" stroke-width="1" />
    <circle cx="400" cy="300" r="220" fill="none" stroke="#ff7a90" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Glass Card (Showcase Profile Mockup) -->
  <g transform="translate(150, 100)">
    <rect x="-1" y="-1" width="502" height="402" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <rect width="500" height="400" rx="24" fill="url(#cardGrad)" />

    <!-- Student Profile Header -->
    <g transform="translate(30, 30)">
      <!-- Avatar -->
      <circle cx="30" cy="30" r="30" fill="rgba(181, 140, 255, 0.2)" stroke="url(#orchidGrad)" stroke-width="2" />
      <text x="30" y="37" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#ffffff" text-anchor="middle">SK</text>
      
      <text x="80" y="24" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#ffffff">Sandeep Kalachand</text>
      <text x="80" y="44" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.5)">University of Mauritius · BSc Computer Science</text>
    </g>

    <line x1="30" y1="110" x2="470" y2="110" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Feature Showcase Item Card -->
    <g transform="translate(30, 130)">
      <rect width="440" height="230" rx="16" fill="rgba(255, 255, 255, 0.01)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      
      <!-- Card Image/Visual placeholder -->
      <rect x="15" y="15" width="410" height="110" rx="10" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <path d="M 30 100 Q 120 40 210 90 T 400 50" fill="none" stroke="url(#orchidGrad)" stroke-width="3" />
      <circle cx="210" cy="90" r="5" fill="#ff7a90" />
      <circle cx="400" cy="50" r="5" fill="#38d9e8" />
      
      <!-- Project Metadata -->
      <text x="20" y="155" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#ffffff">Real-time Solar Irradiance Tracker</text>
      <text x="20" y="175" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.5)">An open-source sensor dashboard deployed for Lagoon Analytics.</text>

      <!-- Tech tags inside showcase -->
      <g transform="translate(20, 195)">
        <!-- Tag 1 -->
        <rect x="0" y="0" width="70" height="20" rx="10" fill="rgba(181, 140, 255, 0.1)" stroke="rgba(181, 140, 255, 0.3)" stroke-width="0.7" />
        <text x="35" y="14" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#b58cff" text-anchor="middle">React</text>

        <!-- Tag 2 -->
        <rect x="78" y="0" width="60" height="20" rx="10" fill="rgba(56, 217, 232, 0.1)" stroke="rgba(56, 217, 232, 0.3)" stroke-width="0.7" />
        <text x="108" y="14" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#38d9e8" text-anchor="middle">IoT</text>

        <!-- Tag 3 -->
        <rect x="146" y="0" width="80" height="20" rx="10" fill="rgba(74, 222, 155, 0.1)" stroke="rgba(74, 222, 155, 0.3)" stroke-width="0.7" />
        <text x="186" y="14" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#4ade9b" text-anchor="middle">Rust Server</text>
      </g>

      <!-- Star/GitHub stats -->
      <g transform="translate(380, 195)">
        <path d="M 10 2 L 13 8 L 20 9 L 15 14 L 16 20 L 10 17 L 4 20 L 5 14 L 0 9 L 7 8 Z" fill="#ffb347" transform="scale(0.8) translate(0, 2)" />
        <text x="20" y="15" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="rgba(255, 255, 255, 0.7)">42 stars</text>
      </g>
    </g>
  </g>
</svg>
