<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="100%" height="100%">
  <!-- Visual vision lines and Mauritius network geometry -->
  <g stroke="#ff7a90" stroke-opacity="0.24" stroke-width="2" fill="none">
    <!-- Concentric core focus circles -->
    <circle cx="800" cy="600" r="410" stroke-dasharray="12 12" />
    <circle cx="800" cy="600" r="290" />
    <circle cx="800" cy="600" r="150" stroke-dasharray="6 6" />
    
    <!-- Vision angles / lines -->
    <line x1="800" y1="180" x2="800" y2="1020" />
    <line x1="380" y1="600" x2="1220" y2="600" />
    <line x1="500" y1="300" x2="1100" y2="900" stroke-dasharray="10 10" />
    <line x1="500" y1="900" x2="1100" y2="300" stroke-dasharray="10 10" />

    <!-- Mauritius stylized outline background -->
    <g transform="translate(670, 410) scale(2.0)" stroke-width="1.5">
      <!-- Port Louis -->
      <circle cx="20" cy="30" r="6" fill="rgba(255, 122, 144, 0.35)" />
      <!-- Ebène Cybercity / Cybercity -->
      <circle cx="35" cy="50" r="8" fill="rgba(255, 122, 144, 0.35)" stroke-width="2" stroke="#ffb347" stroke-opacity="0.2" />
      <!-- Moka -->
      <circle cx="45" cy="45" r="5" stroke="#ffb347" stroke-opacity="0.2" />
      <!-- Curepipe -->
      <circle cx="40" cy="75" r="6" stroke="#ffb347" stroke-opacity="0.2" />
      <!-- Grand Baie -->
      <circle cx="55" cy="10" r="5" stroke="#ffb347" stroke-opacity="0.2" />
      <!-- Flacq -->
      <circle cx="95" cy="50" r="5" stroke="#ffb347" stroke-opacity="0.2" />
      <!-- Mahebourg -->
      <circle cx="85" cy="95" r="6" stroke="#ffb347" stroke-opacity="0.2" />
      
      <!-- Connections -->
      <path d="M 20 30 L 35 50" />
      <path d="M 35 50 L 45 45" />
      <path d="M 35 50 L 40 75" />
      <path d="M 45 45 L 55 10" />
      <path d="M 45 45 L 95 50" />
      <path d="M 40 75 L 85 95" />
      <path d="M 95 50 L 85 95" />
    </g>
  </g>
</svg>
